table:
  name: tournament_trophies
  schema: public
object_relationships:
  - name: player
    using:
      manual_configuration:
        column_mapping:
          player_steam_id: steam_id
        insertion_order: null
        remote_table:
          name: players
          schema: public
  - name: team
    using:
      manual_configuration:
        column_mapping:
          team_id: id
        insertion_order: null
        remote_table:
          name: teams
          schema: public
  - name: tournament
    using:
      manual_configuration:
        column_mapping:
          tournament_id: id
        insertion_order: null
        remote_table:
          name: tournaments
          schema: public
  - name: tournament_team
    using:
      manual_configuration:
        column_mapping:
          tournament_team_id: id
        insertion_order: null
        remote_table:
          name: tournament_teams
          schema: public
  - name: trophy_config
    using:
      manual_configuration:
        column_mapping:
          placement: placement
          tournament_id: tournament_id
        insertion_order: null
        remote_table:
          name: tournament_trophy_configs
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        tournament:
          is_organizer:
            _eq: true
      set:
        manual: "true"
      columns:
        - tournament_id
        - tournament_team_id
        - player_steam_id
        - placement
    comment: ""
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - tournament_id
        - tournament_team_id
        - team_id
        - player_steam_id
        - placement
        - placement_tier
        - manual
        - created_at
      filter: {}
      allow_aggregations: true
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        tournament:
          is_organizer:
            _eq: true
    comment: ""
