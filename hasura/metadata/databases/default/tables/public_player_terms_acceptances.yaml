table:
  name: player_terms_acceptances
  schema: public
object_relationships:
  - name: player
    using:
      foreign_key_constraint_on: player_steam_id
select_permissions:
  - role: user
    permission:
      columns:
        - player_steam_id
        - terms_version
        - accepted_at
      filter:
        player_steam_id:
          _eq: X-Hasura-User-Id
    comment: ""
