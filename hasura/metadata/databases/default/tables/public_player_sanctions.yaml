table:
  name: player_sanctions
  schema: public
object_relationships:
  - name: e_sanction_type
    using:
      foreign_key_constraint_on: type
  - name: player
    using:
      foreign_key_constraint_on: player_steam_id
  - name: sanctioned_by
    using:
      foreign_key_constraint_on: sanctioned_by_steam_id
  - name: revoked_by
    using:
      foreign_key_constraint_on: revoked_by_steam_id
computed_fields:
  - name: is_active
    definition:
      function:
        name: player_sanction_is_active
        schema: public
select_permissions:
  - role: guest
    permission:
      columns:
        - player_steam_id
        - sanctioned_by_steam_id
        - reason
        - type
        - created_at
        - remove_sanction_date
        - id
        - deleted_at
      computed_fields:
        - is_active
      filter:
        _and:
          - is_active:
              _eq: true
          - type:
              _nin:
                - website_chat_mute
                - website_restriction
    comment: "Public can see the reason and duration of a player's CURRENTLY ACTIVE sanction only -- expired/revoked/deleted sanctions are hidden to keep past history private."
  - role: user
    permission:
      columns:
        - player_steam_id
        - sanctioned_by_steam_id
        - reason
        - type
        - created_at
        - remove_sanction_date
        - id
        - deleted_at
      computed_fields:
        - is_active
      filter:
        _and:
          - is_active:
              _eq: true
          - type:
              _nin:
                - website_chat_mute
                - website_restriction
    comment: "Same as guest -- logged-in regular players see the reason and duration of another player's CURRENTLY ACTIVE sanction only, not history. A separate 'user' entry existed originally but was accidentally dropped when a Dec 2025 commit renamed it to 'guest' instead of adding guest alongside it."
  - role: administrator
    permission:
      columns:
        - id
        - player_steam_id
        - sanctioned_by_steam_id
        - revoked_by_steam_id
        - evidence_message_id
        - reason
        - type
        - created_at
        - remove_sanction_date
        - deleted_at
      filter: {}
    comment: Administrators can review active, expired, and revoked website moderation sanctions.
update_permissions:
  - role: administrator
    permission:
      columns:
        - remove_sanction_date
      filter:
        deleted_at:
          _is_null: true
      check: {}
    comment: Administrators can adjust the expiry of any active sanction.
  - role: match_organizer
    permission:
      columns:
        - remove_sanction_date
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - type:
              _nin:
                - website_chat_mute
                - website_restriction
      check:
        type:
          _nin:
            - website_chat_mute
            - website_restriction
    comment: ""
  - role: moderator
    permission:
      columns:
        - remove_sanction_date
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - type:
              _nin:
                - website_chat_mute
                - website_restriction
      check:
        type:
          _nin:
            - website_chat_mute
            - website_restriction
    comment: ""
event_triggers:
  - name: player_sanctions
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns:
          - player_steam_id
          - remove_sanction_date
          - type
          - deleted_at
    retry_conf:
      interval_sec: 10
      num_retries: 6
      timeout_sec: 60
    webhook: '{{HASURA_GRAPHQL_EVENT_HOOK}}'
