table:
  name: notifications
  schema: public
event_triggers:
  - name: notification_events
    definition:
      enable_manual: true
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 6
      timeout_sec: 60
    webhook: '{{HASURA_GRAPHQL_EVENT_HOOK}}'
object_relationships:
  - name: player
    using:
      foreign_key_constraint_on: steam_id
select_permissions:
  - role: administrator
    permission:
      columns:
        - actions
        - created_at
        - deletable
        - deleted_at
        - entity_id
        - id
        - is_read
        - message
        - role
        - steam_id
        - title
        - type
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _in:
                - administrator
                - moderator
    comment: ""
  - role: match_organizer
    permission:
      columns:
        - actions
        - created_at
        - deletable
        - deleted_at
        - entity_id
        - id
        - is_read
        - message
        - role
        - steam_id
        - title
        - type
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _eq: match_organizer
    comment: ""
  - role: moderator
    permission:
      columns:
        - actions
        - created_at
        - deletable
        - deleted_at
        - entity_id
        - id
        - is_read
        - message
        - role
        - steam_id
        - title
        - type
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _eq: moderator
    comment: ""
  - role: tournament_organizer
    permission:
      columns:
        - actions
        - created_at
        - deletable
        - deleted_at
        - entity_id
        - id
        - is_read
        - message
        - role
        - steam_id
        - title
        - type
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _in:
                - match_organizer
                - tournament_organizer
    comment: ""
  - role: user
    permission:
      columns:
        - actions
        - created_at
        - deletable
        - deleted_at
        - entity_id
        - id
        - is_read
        - message
        - role
        - steam_id
        - title
        - type
      filter:
        steam_id:
          _eq: X-Hasura-User-Id
    comment: ""
update_permissions:
  - role: administrator
    permission:
      columns:
        - deleted_at
        - is_read
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _in:
                - administrator
                - moderator
      check:
        _and:
          - _or:
              - steam_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - administrator
                    - moderator
          - _or:
              - deleted_at:
                  _is_null: true
              - deletable:
                  _eq: true
    comment: ""
  - role: match_organizer
    permission:
      columns:
        - deleted_at
        - is_read
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _eq: match_organizer
      check:
        _and:
          - _or:
              - steam_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: match_organizer
          - _or:
              - deleted_at:
                  _is_null: true
              - deletable:
                  _eq: true
    comment: ""
  - role: moderator
    permission:
      columns:
        - deleted_at
        - is_read
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _eq: moderator
      check:
        _and:
          - _or:
              - steam_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _eq: moderator
          - _or:
              - deleted_at:
                  _is_null: true
              - deletable:
                  _eq: true
    comment: ""
  - role: tournament_organizer
    permission:
      columns:
        - deleted_at
        - is_read
      filter:
        _or:
          - steam_id:
              _eq: X-Hasura-User-Id
          - role:
              _in:
                - match_organizer
                - tournament_organizer
      check:
        _and:
          - _or:
              - steam_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - match_organizer
                    - tournament_organizer
          - _or:
              - deleted_at:
                  _is_null: true
              - deletable:
                  _eq: true
    comment: ""
  - role: user
    permission:
      columns:
        - deleted_at
        - is_read
      filter:
        steam_id:
          _eq: X-Hasura-User-Id
      check:
        _and:
          - steam_id:
              _eq: X-Hasura-User-Id
          - _or:
              - deleted_at:
                  _is_null: true
              - deletable:
                  _eq: true
    comment: ""
