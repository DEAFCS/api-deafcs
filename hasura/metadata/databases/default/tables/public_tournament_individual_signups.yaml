table:
  name: tournament_individual_signups
  schema: public
object_relationships:
  - name: player
    using:
      foreign_key_constraint_on: player_steam_id
  - name: tournament
    using:
      foreign_key_constraint_on: tournament_id
  - name: tournament_team
    using:
      foreign_key_constraint_on: tournament_team_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - player_steam_id:
              _eq: X-Hasura-User-Id
          - tournament:
              status:
                _eq: RegistrationOpen
          - tournament:
              options:
                individual_registration_enabled:
                  _eq: true
          - tournament:
              meets_min_role:
                _eq: true
      columns:
        - tournament_id
        - player_steam_id
    comment: ""
select_permissions:
  - role: guest
    permission:
      columns:
        - id
        - tournament_id
        - player_steam_id
        - status
        - tournament_team_id
        - created_at
        - checked_in_at
      filter: {}
    comment: ""
  - role: user
    permission:
      columns:
        - id
        - tournament_id
        - player_steam_id
        - status
        - tournament_team_id
        - created_at
        - checked_in_at
      filter: {}
    comment: ""
delete_permissions:
  - role: user
    permission:
      # Self-leave only, and only while the participant list is still open.
      # The registration/check-in cutoff is the RegistrationOpen ->
      # RegistrationClosed transition ProcessTournamentAttendance performs,
      # so gating on it here keeps this direct path in step with
      # removeTournamentIndividualPlayer rather than offering a way around
      # its cutoff guard. Waitlisted is included because a waitlisted player
      # may equally change their mind; Assigned is excluded, since by then
      # they are on a generated team.
      filter:
        _and:
          - player_steam_id:
              _eq: X-Hasura-User-Id
          - status:
              _in:
                - Registered
                - Waitlisted
          - tournament:
              status:
                _eq: RegistrationOpen
    comment: ""
