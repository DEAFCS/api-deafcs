table:
  name: tournament_team_roster
  schema: public
object_relationships:
  - name: e_team_role
    using:
      foreign_key_constraint_on: role
  - name: player
    using:
      foreign_key_constraint_on: player_steam_id
  - name: tournament
    using:
      foreign_key_constraint_on: tournament_id
  - name: tournament_team
    using:
      foreign_key_constraint_on: tournament_team_id
computed_fields:
  - name: target_meets_min_role
    definition:
      function:
        name: tournament_team_roster_target_meets_min_role
        schema: public
insert_permissions:
  - role: tournament_organizer
    permission:
      check:
        _and:
          - target_meets_min_role:
              _eq: true
          - _or:
              - tournament:
                  is_organizer:
                    _eq: true
              - tournament_team:
                  _or:
                    - roster:
                        _and:
                          - player_steam_id:
                              _eq: X-Hasura-User-Id
                          - role:
                              _eq: Admin
                    - owner_steam_id:
                        _eq: X-Hasura-User-Id
                    - team:
                        owner_steam_id:
                          _eq: X-Hasura-User-Id
                    - team:
                        captain_steam_id:
                          _eq: X-Hasura-User-Id
                    - team:
                        roster:
                          _and:
                            - player_steam_id:
                                _eq: X-Hasura-User-Id
                            - role:
                                _eq: Admin
          - tournament:
              status:
                _nin:
                  - Cancelled
                  - CancelledMinTeams
                  - Finished
      columns:
        - player_steam_id
        - tournament_id
        - tournament_team_id
    comment: ""
  - role: user
    permission:
      check:
        _and:
          - target_meets_min_role:
              _eq: true
          - _or:
              - _and:
                  - _or:
                      - tournament:
                          is_organizer:
                            _eq: true
                      - _and:
                          - tournament:
                              meets_min_role:
                                _eq: true
                          - tournament_team:
                              _or:
                                - roster:
                                    _and:
                                      - player_steam_id:
                                          _eq: X-Hasura-User-Id
                                      - role:
                                          _eq: Admin
                                - owner_steam_id:
                                    _eq: X-Hasura-User-Id
                                - team:
                                    owner_steam_id:
                                      _eq: X-Hasura-User-Id
                                - team:
                                    captain_steam_id:
                                      _eq: X-Hasura-User-Id
                                - team:
                                    roster:
                                      _and:
                                        - player_steam_id:
                                            _eq: X-Hasura-User-Id
                                        - role:
                                            _eq: Admin
                  - tournament:
                      status:
                        _in:
                          - Setup
                          - RegistrationOpen
              - _and:
                  # Self-accept: converting an already-issued
                  # tournament_team_invites row into a roster row for
                  # yourself. Kept as its own branch (rather than folded
                  # into the block above) because it needs a broader status
                  # window -- an invite can legitimately still be accepted
                  # after registration closes, same window already used for
                  # organizer-driven roster writes elsewhere in this table.
                  - player_steam_id:
                      _eq: X-Hasura-User-Id
                  - tournament_team:
                      invites:
                        steam_id:
                          _eq: X-Hasura-User-Id
                  - tournament:
                      status:
                        _nin:
                          - Cancelled
                          - CancelledMinTeams
                          - Finished
      columns:
        - player_steam_id
        - tournament_id
        - tournament_team_id
    comment: ""
select_permissions:
  - role: guest
    permission:
      columns:
        - player_steam_id
        - role
        - tournament_id
        - tournament_team_id
        - roster_image_url_snapshot
      filter: {}
      allow_aggregations: true
    comment: ""
update_permissions:
  - role: tournament_organizer
    permission:
      columns:
        - role
      filter:
        _or:
          - tournament_team:
              roster:
                _and:
                  - player_steam_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: Admin
          - tournament:
              is_organizer:
                _eq: true
      check:
        target_meets_min_role:
          _eq: true
    comment: ""
  - role: user
    permission:
      columns:
        - role
      filter:
        _or:
          - tournament_team:
              roster:
                _and:
                  - player_steam_id:
                      _eq: X-Hasura-User-Id
                  - role:
                      _eq: Admin
          - tournament:
              is_organizer:
                _eq: true
      check:
        _and:
          - target_meets_min_role:
              _eq: true
          - _or:
              - tournament_team:
                  roster:
                    _and:
                      - player_steam_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: Admin
              - tournament:
                  is_organizer:
                    _eq: true
    comment: ""
delete_permissions:
  - role: tournament_organizer
    permission:
      filter:
        _and:
          - _or:
              - tournament:
                  is_organizer:
                    _eq: true
              - tournament_team:
                  _or:
                    - roster:
                        _and:
                          - player_steam_id:
                              _eq: X-Hasura-User-Id
                          - role:
                              _eq: Admin
                    - owner_steam_id:
                        _eq: X-Hasura-User-Id
          - tournament:
              status:
                _nin:
                  - Cancelled
                  - CancelledMinTeams
                  - Finished
    comment: ""
  - role: user
    permission:
      filter:
        _and:
          - _or:
              - tournament_team:
                  roster:
                    _and:
                      - player_steam_id:
                          _eq: X-Hasura-User-Id
                      - role:
                          _eq: Admin
              - tournament:
                  is_organizer:
                    _eq: true
              - player_steam_id:
                  _eq: X-Hasura-User-Id
          - tournament:
              status:
                _nin:
                  - Cancelled
                  - CancelledMinTeams
                  - Finished
                  - Live
    comment: ""
