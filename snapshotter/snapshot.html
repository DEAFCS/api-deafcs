<!DOCTYPE html>
<!--
  Loaded by server.js (one Playwright page per active match_id:steam_id
  pair), no query params needed. Builds the RTCPeerConnection and does
  the actual media/ICE/DTLS work here in the browser (that part has to
  happen in-page), but does NOT fetch() the WHEP endpoint itself --
  server.js does that over plain Node http, and hands the answer SDP
  back in via window.__setAnswer(). See server.js for why (CORS).
  server.js is also the one deciding when to screenshot this and how
  often. No STUN/TURN needed: this runs in the same cluster as
  mediamtx-camera (same node, even), so it's a plain local connection,
  not the cross-network hop that made this whole service necessary in
  the first place. See DEAFCS/deafcs-web#91.
-->
<html>
<head><meta charset="utf-8" /></head>
<body style="margin:0;background:#000;overflow:hidden">
<video id="v" autoplay playsinline muted style="width:640px;height:360px;object-fit:cover;display:block"></video>
<script>
(function () {
  "use strict";

  // Polled by server.js before trusting a screenshot -- a <video>
  // element with no track still screenshots fine (as a plain black
  // frame), so "the screenshot call didn't throw" is not the same as
  // "there's an actual live frame in it".
  window.__hasFrame = false;

  var pc = new RTCPeerConnection({ iceServers: [] });
  pc.addTransceiver("video", { direction: "recvonly" });
  pc.ontrack = function (e) {
    var video = document.getElementById("v");
    video.srcObject = e.streams[0];
    video.addEventListener("loadeddata", function onLoaded() {
      video.removeEventListener("loadeddata", onLoaded);
      window.__hasFrame = true;
    });
  };
  pc.onconnectionstatechange = function () {
    console.log("[snapshot] connectionState=" + pc.connectionState);
    if (pc.connectionState === "failed" || pc.connectionState === "closed") {
      window.__hasFrame = false;
    }
  };

  // Called by server.js via page.evaluate(). Returns the local offer
  // SDP once ICE gathering has settled -- server.js is the one that
  // actually POSTs it to mediamtx (see server.js).
  window.__createOffer = function () {
    return pc.createOffer().then(function (offer) {
      return pc.setLocalDescription(offer);
    }).then(function () {
      return new Promise(function (resolve) {
        if (pc.iceGatheringState === "complete") return resolve();
        pc.addEventListener("icegatheringstatechange", function onChange() {
          if (pc.iceGatheringState === "complete") {
            pc.removeEventListener("icegatheringstatechange", onChange);
            resolve();
          }
        });
        setTimeout(resolve, 2000);
      });
    }).then(function () {
      console.log("[snapshot] offer ready");
      return pc.localDescription.sdp;
    });
  };

  // Called by server.js via page.evaluate() once it has the answer SDP
  // back from mediamtx.
  window.__setAnswer = function (answerSdp) {
    console.log("[snapshot] setting remote description");
    return pc.setRemoteDescription({ type: "answer", sdp: answerSdp }).then(function () {
      console.log("[snapshot] remote description set");
    });
  };
})();
</script>
</body>
</html>
